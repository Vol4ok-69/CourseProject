services:
  postgres:
    image: postgres:17
    container_name: courseproject-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-courseproject}
      POSTGRES_USER: ${POSTGRES_USER:-courseproject}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-courseproject} -d ${POSTGRES_DB:-courseproject}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - courseproject-network

  database-analyzer-build:
    build:
      context: .
      dockerfile: Dockerfile.database-analyzer
    image: netscope-database-analyzer:latest
    container_name: courseproject-database-analyzer-build
    pull_policy: build
    entrypoint: ["echo", "netscope-database-analyzer:latest image is ready"]
    restart: "no"
    networks:
      - courseproject-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: courseproject-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      database-analyzer-build:
        condition: service_completed_successfully

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-courseproject};Username=${POSTGRES_USER:-courseproject};Password=${POSTGRES_PASSWORD}"
      Security__TokenEncryptionKey: ${TOKEN_ENCRYPTION_KEY}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-CourseProjectApi}
      Jwt__Audience: ${JWT_AUDIENCE:-CourseProjectClient}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      DOCKER_EXCHANGE_VOLUME: courseproject-exchange-data

    ports:
      - "5000:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - netscope_exchange:/tmp/netscope-database-analyzer

    group_add:
      - "${DOCKER_GID:-0}"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - courseproject-network

volumes:
  postgres_data:
  netscope_exchange:
    name: courseproject-exchange-data

networks:
  courseproject-network:
    driver: bridge
